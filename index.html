<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Penalty Champions 3D</title>
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.169.0",
      "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.3"
    }
  }
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- 2D Swipe & Aim Trail Overlay -->
    <canvas id="trail-canvas"></canvas>

    <!-- HUD Overlay -->
    <div id="hud">
      <!-- Scoreboard -->
      <div id="scoreboard">
        <div class="team team-player">
          <div class="team-name">YOU</div>
          <div class="team-score" id="player-score">0</div>
          <div class="round-dots" id="player-dots">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>
        <div class="score-divider">
          <div class="round-label" id="round-label">ROUND 1</div>
          <div class="vs">VS</div>
        </div>
        <div class="team team-ai">
          <div class="team-name">CPU</div>
          <div class="team-score" id="ai-score">0</div>
          <div class="round-dots" id="ai-dots">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>
      </div>

      <!-- Role Indicator Banner -->
      <div id="role-indicator" class="hidden">
        <span id="role-text">YOUR TURN: SWIPE TO SHOOT</span>
      </div>

      <!-- Power / Curve Telemetry Meter -->
      <div id="power-meter" class="hidden">
        <div class="meter-group">
          <div class="meter-label">SHOT POWER</div>
          <div class="meter-bar"><div class="meter-fill" id="power-fill"></div></div>
        </div>
        <div class="meter-group">
          <div class="meter-label">MAGNUS CURVE</div>
          <div class="meter-bar"><div class="meter-fill curve-fill" id="curve-fill"></div></div>
        </div>
      </div>

      <!-- Interactive 6 Dive Target Selector (Keeper Mode) -->
      <div id="zone-selector" class="hidden">
        <div class="zone-header">TAP GOAL OR SELECT DIVE ZONE</div>
        <div class="zone-grid">
          <button class="zone-btn" data-zone="0" title="Top-Left">↖<span class="zone-name">TOP L</span></button>
          <button class="zone-btn" data-zone="1" title="Top-Center">↑<span class="zone-name">TOP C</span></button>
          <button class="zone-btn" data-zone="2" title="Top-Right">↗<span class="zone-name">TOP R</span></button>
          <button class="zone-btn" data-zone="3" title="Bottom-Left">↙<span class="zone-name">BOT L</span></button>
          <button class="zone-btn" data-zone="4" title="Bottom-Center">↓<span class="zone-name">BOT C</span></button>
          <button class="zone-btn" data-zone="5" title="Bottom-Right">↘<span class="zone-name">BOT R</span></button>
        </div>
      </div>

      <!-- Centered Message Overlay -->
      <div id="message-overlay" class="hidden">
        <div id="message-text">GOAL!</div>
      </div>
    </div>

    <!-- Start Match Screen -->
    <div id="start-screen">
      <div class="start-content">
        <div class="start-badge">CHAMPIONSHIP EDITION</div>
        <h1>⚽ PENALTY<br>CHAMPIONS 3D</h1>
        <p class="subtitle">Swipe up to shoot & bend the ball • Tap goal zones to dive & save</p>
        <button id="start-btn">KICK OFF</button>
      </div>
    </div>

    <!-- End Match Screen -->
    <div id="end-screen" class="hidden">
      <div class="end-content">
        <h2 id="end-title">MATCH OVER</h2>
        <div id="end-score">0 - 0</div>
        <button id="replay-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
